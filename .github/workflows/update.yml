name: Update Lanka Chat feeds
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node update.js
      - run: |
          git config user.name "isuru-cloud-agent"
          git config user.email "isuru20206@gmail.com"
          git add news.json live.json
          git diff --cached --quiet || git commit -m "Update news + live feeds"
          git push
